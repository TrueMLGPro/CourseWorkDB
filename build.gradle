plugins {
    id 'java'
    id 'application'
}

group = 'com.vitaliyrev.courseworkdb'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.2'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'org.slf4j:slf4j-nop:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'org.assertj:assertj-swing-junit:3.17.1'

    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

mainClassName = 'com.vitaliyrev.courseworkdb.app.Main'

jar {
    manifest {
        attributes 'Main-Class': 'com.vitaliyrev.courseworkdb.app.Main'
    }
}

test {
    useJUnitPlatform()
    systemProperties = [
        'db.url': 'jdbc:postgresql://localhost:5432/course_work_test_db',
        'db.user': 'course_work_test_db_admin',
        'db.password': 'courseworktestdb123'
    ]
}

tasks.withType(Test).configureEach {
    jvmArgs = jvmArgs + ['--add-opens=java.base/java.util=ALL-UNNAMED']
}

tasks.register('runWithJavaExec', JavaExec) {
    group = "Execution"
    description = "Run the main class with JavaExecTask"
    classpath = sourceSets.main.runtimeClasspath
}